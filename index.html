<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Image convertor</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="./assets/css/main.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.1/css/all.min.css">
</head>

<body>
  <form action="">
    <div class="container-box">
      <h4 class="text-center">Image File convertor</h4>
      <br />
      <div class="error"></div>
      <div class="drag-area">
        <div class="img-preview">
          <img src="" height="150" alt="img-preview">
          <i class="fa-solid fa-circle-xmark remove-file"></i>
        </div>
        <div class="upload-content">
          <i class="fa-solid fa-cloud-arrow-up"></i>
          <br>
          <br>
          <h5>Drag and Drop here</h5>
          <h5>or</h5>
          <input type="file" hidden />
          <h5 class="browse-file-text">Browse Files</h5>
        </div>
      </div>
      <span class="supports-file">Supports: PNG, JPG, JPEG, WEBP</span>
      <div class="op-format" style="display: none;">
        <br>
        <h6>Output Format</h6>
        <select name="imagetype" class="form-select">
          <option value="image/png">PNG</option>
          <option value="image/jpg" selected>JPG</option>
          <option value="image/jpeg">JPEG</option>
          <option value="image/webp">Webp</option>
        </select>
        <br>
      </div>
      <button class="convert" style="display: none;">CONVERT</button>
    </div>
  </form>

  <bootstrapalert style="display: none">
    <div class="alert alert-danger alert-dismissible fade show" role="alert">
      File type should be PNG Image
      <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>
  </bootstrapalert>

  <div class="overlay" id="overlay">
    <div class="drag-area" style="border: none;">
      <div class="upload-content">
        <i class="fa-solid fa-cloud-arrow-up"></i>
        <br><br>
        <h5>Drop file to upload</h5>
      </div>
    </div>
  </div>
</body>
<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="./assets/js/main.js"></script>

</html>
